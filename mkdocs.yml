site_name: hello-ebpf
site_url: https://parttimenerd.github.io/hello-ebpf/
repo_url: https://github.com/parttimenerd/hello-ebpf
repo_name: parttimenerd/hello-ebpf
exclude_docs: |
  superpowers/
not_in_nav: |
  helpers.md
  userspace-scheduler.md
  scheduler-article.md
  sched_ext.md
  sched-ext/sound-scheduler.md
theme:
  name: material
features:
    - navigation.tabs
    - navigation.sections
    - content.code.annotate
    - content.code.copy
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
nav:
  - Home: index.md
  - Getting Started:
    - Install & Prerequisites: getting-started/install.md
    - Your First BPF Program: getting-started/hello.md
    - How the Plugin Works: getting-started/how-it-works.md
  - Guides:
    - Maps: maps.md
    - Global Variables & Types: global-variables.md
    - Shared Maps (@SharedFrom): shared-maps.md
    - BPF Arenas (@InArena): arenas.md
    - XDP: xdp.md
    - TC: tc.md
    - Tracepoints: tracepoints.md
    - Kprobes: kprobes.md
    - Uprobes: uprobes.md
    - Attach Cookies & Multi-Attach: attach-cookies-multi.md
    - LSM & Cgroup: lsm.md
    - Tail Calls: tail-calls.md
    - Map-of-Maps: map-of-maps.md
    - struct_ops in Java: struct-ops.md
    - Timers: timers.md
    - Profiling: profiling.md
  - sched_ext:
    - Overview: sched-ext/index.md
    - Writing a Scheduler: sched-ext/guide.md
    - Kernelspace Scheduler: sched-ext/kernel-side.md
    - Userspace Scheduler: sched-ext/userspace.md
    - Callbacks Reference: sched-ext/callbacks.md
    - Cookbook: sched-ext/cookbook.md
    - Chaos Scheduler: sched-ext/chaos-scheduler.md
    - Fun Schedulers: sched-ext/fun-schedulers.md
  - Reference:
    - Cheat Sheet: cheatsheet.md
    - Feature Matrix: feature-matrix.md
    - Annotations Catalog: reference/annotations.md
    - BPFJ Helpers Catalog: reference/bpfj.md
    - JavaDoc API: reference/javadoc.md
    - Diagnostics: diagnostics.md
    - Cookbook: cookbook.md
  - Samples:
    - Index & Selection Guide: samples/index.md
  - Architecture:
    - Compiler Plugin: architecture/plugin.md
    - Annotation Processor: architecture/processor.md
    - Error Classifier: architecture/errors.md
    - Contributing: architecture/contributing.md
  - Changelog: changelog.md
markdown_extensions:
  - admonition
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.snippets:
      base_path: ["."]
      check_paths: true
      dedent_subsections: true
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - toc:
      permalink: true

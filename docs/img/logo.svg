<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="hexGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#3949AB"/>
      <stop offset="100%" stop-color="#1A237E"/>
    </linearGradient>
    <linearGradient id="cupGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#FF9800"/>
      <stop offset="100%" stop-color="#E65100"/>
    </linearGradient>
  </defs>

  <!-- Hexagon (eBPF emblem shape) -->
  <polygon
    points="60,6 103,30 103,90 60,114 17,90 17,30"
    fill="url(#hexGrad)"
    stroke="#7986CB"
    stroke-width="2.5"
  />

  <!-- Coffee cup body -->
  <rect x="38" y="44" width="34" height="28" rx="3" ry="3"
        fill="url(#cupGrad)"/>

  <!-- Cup handle -->
  <path d="M72,50 Q84,50 84,58 Q84,66 72,66"
        fill="none" stroke="#FF9800" stroke-width="4" stroke-linecap="round"/>

  <!-- Cup base / saucer -->
  <rect x="34" y="72" width="42" height="4" rx="2" ry="2"
        fill="#FFB300"/>

  <!-- Steam wisps -->
  <path d="M47,40 Q44,34 47,28" fill="none" stroke="#90CAF9"
        stroke-width="2.5" stroke-linecap="round"/>
  <path d="M55,38 Q52,31 55,24" fill="none" stroke="#90CAF9"
        stroke-width="2.5" stroke-linecap="round"/>
  <path d="M63,40 Q60,34 63,28" fill="none" stroke="#90CAF9"
        stroke-width="2.5" stroke-linecap="round"/>

  <!-- eBPF "bee" antennae -->
  <line x1="48" y1="16" x2="55" y2="24" stroke="#90CAF9" stroke-width="1.8"/>
  <line x1="72" y1="16" x2="65" y2="24" stroke="#90CAF9" stroke-width="1.8"/>
  <circle cx="47" cy="14" r="3.5" fill="#90CAF9"/>
  <circle cx="73" cy="14" r="3.5" fill="#90CAF9"/>
</svg>

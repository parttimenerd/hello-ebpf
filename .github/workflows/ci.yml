name: ci
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sanity:
    name: Sanity checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: All pom.xml subdirs are declared as modules
        run: |
          missing=()
          for dir in */; do
            dir="${dir%/}"
            [ -f "$dir/pom.xml" ] || continue
            grep -q "<module>${dir}</module>" pom.xml && continue
            missing+=("$dir")
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "ERROR: subdirectories with pom.xml not listed in root pom.xml <modules>:"
            printf '  %s\n' "${missing[@]}"
            exit 1
          fi
          echo "OK: all pom.xml subdirs are declared as modules"

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: sanity
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 22
        uses: actions/setup-java@v4
        with:
          java-version: '22'
          distribution: 'sapmachine'

      - name: Cache Maven
        uses: actions/cache@v4
        with:
          path: |
            ~/.m2/repository
            rawbpf/bin/jextract-22
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      - uses: ./.github/actions/setup-build-env
        with:
          github-token: ${{ github.token }}

      - name: mvn package
        run: ./mvnw -ntp -B package -DskipTests

      - name: upload bpf/target/bpf.jar
        uses: actions/upload-artifact@v4
        with:
          name: bpf.jar
          path: bpf/target/bpf.jar

  docs:
    name: Deploy docs
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # needed for git-based versioning in mkdocs

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install mkdocs-material
        run: pip install -r docs-requirements.txt

      - name: Setup Java 22
        uses: actions/setup-java@v4
        with:
          java-version: '22'
          distribution: 'sapmachine'

      - name: Cache Maven
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-m2-docs-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      - uses: ./.github/actions/setup-build-env
        with:
          github-token: ${{ github.token }}

      - name: Install bpf-compiler-plugin
        run: ./mvnw -ntp -B install -DskipTests -pl bpf-compiler-plugin

      - name: Generate JavaDoc
        run: ./mvnw -ntp -B javadoc:javadoc -DskipTests -pl bpf
        env:
          MAVEN_OPTS: "-Xss16m -Xmx3g"

      - name: Build docs (strict)
        run: mkdocs build --strict

      - name: Copy JavaDoc into site
        run: cp -r bpf/target/site/apidocs site/javadoc

      - name: Deploy to GitHub Pages
        run: mkdocs gh-deploy --force

  hosted-test:
    name: Run tests on ubuntu-26.04 (hosted)
    runs-on: ubuntu-26.04
    needs: build
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 22
        uses: actions/setup-java@v4
        with:
          java-version: '22'
          distribution: 'sapmachine'

      - name: Cache Maven
        uses: actions/cache@v4
        with:
          path: |
            ~/.m2/repository
            rawbpf/bin/jextract-22
          key: ${{ runner.os }}-26-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-26-m2

      - name: Show kernel info
        run: |
          uname -r
          grep -E 'CONFIG_SCHED_CLASS_EXT|CONFIG_BPF_LSM|CONFIG_BPF_JIT' /boot/config-$(uname -r) 2>/dev/null || \
            zcat /proc/config.gz 2>/dev/null | grep -E 'CONFIG_SCHED_CLASS_EXT|CONFIG_BPF_LSM|CONFIG_BPF_JIT' || \
            echo "kernel config not available"
          ls /sys/kernel/btf/vmlinux && echo "BTF present" || echo "BTF missing"

      - uses: ./.github/actions/setup-build-env
        with:
          clang-package: clang
          github-token: ${{ github.token }}

      - name: Install full reactor (bpf-compiler-plugin, bpf, bpf-samples)
        run: ./mvnw -ntp -B install -DskipTests

      - name: Run BPF tests (as root)
        # SchedulerSmokeTest attaches real sched_ext schedulers; the shared hosted
        # runner's watchdog evicts them under load (central/fcfs flake here but pass
        # 19/19 on the thinkstation VNG node, which is their intended CI home).
        run: |
          USER_M2=$HOME/.m2/repository
          sudo -E env HOME=$HOME JAVA_HOME=$JAVA_HOME PATH=$JAVA_HOME/bin:$PATH \
            ./mvnw -ntp -B test -pl bpf,bpf-samples \
            -Dmaven.test.skip=false -DskipTests=false \
            -Dtest='!SchedulerSmokeTest,!RustySchedulerSmokeTest,!LotterySampleSmokeTest' \
            -Dsurefire.failIfNoSpecifiedTests=false \
            -Dmaven.repo.local=$USER_M2

      - name: Publish Test Report
        uses: mikepenz/action-junit-report@v4
        if: always()
        with:
          check_name: 'Test Report (ubuntu-26.04)'
          report_paths: '**/target/surefire-reports/TEST-*.xml'
